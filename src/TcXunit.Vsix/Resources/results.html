<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TcXunit Results</title>
<link rel="stylesheet" href="vsix-tokens.css" />
<link rel="stylesheet" href="vsix-shell.css" />
<link rel="stylesheet" href="results.css" />
</head>
<body>
  <!--
    WebView2 page loaded by ResultsToolWindowControl.xaml.cs, which follows the VS
    host's light/dark theme (document.body.dataset.theme, pushed via
    ExecuteScriptAsync -- see BuildApplyThemeScript there) and, after a run,
    pushes the CLI's run-result JSON in by calling window.tcxunitRenderResult(...)
    (see results.js, and BuildRenderResultScript on the host side).

    #runButton (TcXunit-1tt.3) is the panel's one send-btn/stop-btn per
    design-system.html's "exactly two [buttons]" rule and user story 12
    ("unambiguous about which action is live"): a click posts the string
    'run' or 'stop' to the WPF host via window.chrome.webview.postMessage
    (see results.js), which drives TcxunitProcessRunner.RunAsync and pushes
    window.tcxunitSetRunning(bool) back in to flip this button's label/class
    and toggle #prog. This retires the separate native WPF "Run tests
    (tcxunit)" button TcXunit-1tt.1/.2 left in ResultsToolWindowControl.xaml,
    per that button's own since-removed comment foreshadowing this ticket.

    #prog is the CSS-only sweep (results.css) shown only while a run is in
    flight -- hidden by default, toggled via the hidden attribute, never a
    class (nothing else about it varies).

    #emptyState is design-system.html's ".empty-state" block (Components --
    Core, so its rules live in vsix-shell.css) shown verbatim until the first
    window.tcxunitRenderResult(...) call this session, at which point
    results.js swaps it out for #tree permanently (a subsequent run's results
    replace #tree's contents in place -- the tree stays visible/updating
    across reruns per the mockup's "running" example, it does not revert to
    this empty state).

    #tree is results.css/.tree's render target, filled in by results.js. The
    .tw-statusbar region is required per docs/design-system.html section 6
    (tool-window anatomy) and is never omitted, even in this empty state.
  -->
  <div class="toolbar">
    <button class="send-btn" type="button" id="runButton">Run tests</button>
    <div class="counts" id="counts">
      <span class="count zero" id="countPass">✓<span class="n">0</span></span>
      <span class="count zero" id="countFail">✗<span class="n">0</span></span>
      <span class="count zero" id="countSkip">–<span class="n">0</span></span>
    </div>
  </div>

  <div class="prog" id="prog" hidden><i></i></div>

  <div class="tw-body">
    <div class="empty-state" id="emptyState">
      <strong>No results yet.</strong>
      Run the suites in this solution to see pass and fail output here. Double-click any
      result to open its .TcPOU in the editor.
    </div>
    <div class="tree" id="tree" hidden></div>
  </div>

  <div class="tw-statusbar">
    <span class="dot"></span>
    <span id="statusText">Ready</span>
  </div>

  <script src="results.js"></script>
</body>
</html>
