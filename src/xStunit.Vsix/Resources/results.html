<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>xStunit Results</title>
<link rel="stylesheet" href="vsix-tokens.css" />
<link rel="stylesheet" href="vsix-shell.css" />
<link rel="stylesheet" href="results.css" />
</head>
<body>
  <!--
    WebView2 page loaded by ResultsToolWindowControl.xaml.cs, which follows the VS
    host's light/dark theme (document.body.dataset.theme, pushed via
    ExecuteScriptAsync -- see BuildApplyThemeScript there) and, after a run,
    pushes the CLI's run-result JSON in by calling window.xstunitRenderResult(...)
    (see results.js, and BuildRenderResultScript on the host side).

    #runButton (TcXunit-1tt.3) is the panel's one send-btn/stop-btn per
    design-system.html's "exactly two [buttons]" rule and user story 12
    ("unambiguous about which action is live"): a click posts the string
    'run' or 'stop' to the WPF host via window.chrome.webview.postMessage
    (see results.js), which drives XstunitProcessRunner.RunAsync and pushes
    window.xstunitSetRunning(bool) back in to flip this button's label/class
    and toggle #prog. This retires the separate native WPF "Run tests
    (xstunit)" button TcXunit-1tt.1/.2 left in ResultsToolWindowControl.xaml,
    per that button's own since-removed comment foreshadowing this ticket.

    #prog is the CSS-only sweep (results.css) shown only while a run is in
    flight -- hidden by default, toggled via the hidden attribute, never a
    class (nothing else about it varies).

    #emptyState is design-system.html's ".empty-state" block (Components --
    Core, so its rules live in vsix-shell.css) shown verbatim until the first
    window.xstunitRenderResult(...) call swaps it out for #tree. As of
    TcXunit-qjt this is no longer a one-way, permanent swap: a run that ends
    without ever reaching xstunitRenderResult (Stop, or a host-level error)
    reverts the page from #runningState back to this empty state instead of
    leaving a stale placeholder on screen -- see results.js's
    xstunitSetRunning and #runningState's own comment below.

    #tree is results.css/.tree's render target, filled in by results.js. The
    .tw-statusbar region is required per docs/design-system.html section 6
    (tool-window anatomy) and is never omitted, even in this empty state.

    tabindex="0" (TcXunit-1tt.7) makes #tree itself the one tabbable element
    for keyboard nav -- a "roving selection" over its .node rows tracked in
    JS (.node.selected, results.css), not per-row tabindex/real DOM focus.
    See results.js's keydown handler: Up/Down move the selection, Enter opens
    the selected row's file (reuses TcXunit-1tt.4's postOpenFile), Space
    toggles a selected suite row's twisty (reuses TcXunit-1tt.2's expand/
    collapse), per docs/design-system.html section 8's A11y rule.

    #statusSeg (TcXunit-1tt.5) is design-system.html section 5's All/Failed/
    Skipped .seg control -- data-status is a separate attribute from data-v
    ("plain", already styled by vsix-shell.css's .seg button.active[data-v]
    rule) purely for results.js to read without depending on visual state.
    Clicking a segment toggles a "filter-fail"/"filter-skip" class on #tree
    itself (see results.css); "All" clears it. #filterInput (design-system.html's
    .field, "Filter tests...") live-filters by suite/test name substring --
    see results.js's applyTextFilter for how the two compose. Per TcXunit-qwh.3,
    both controls live in a second .toolbar-styled row (.tw-footerbar, results.css)
    docked below .tw-body/#tree and above .tw-statusbar, not in the top toolbar --
    results.js only ever looks these up by id, so the move is layout-only.

    #rerunFailedButton (TcXunit-1tt.8) is design-system.html section 5's
    ".ghost-btn" "Rerun failed" affordance (populated-tree example): a click
    posts {type:'rerunFailed'} to the WPF host over the same JSON-envelope
    postMessage channel #tree's node-open double-click uses (TcXunit-1tt.4).
    The host -- not this page -- tracks which suites failed in the last run,
    so the message carries no payload; the host re-invokes xstunit with
    --suite <name> per failed suite and pushes a normal
    window.xstunitRenderResult(...) back in, replacing #tree exactly like any
    other run. Starts `disabled` in markup (no run yet = no failures); results.js
    toggles the attribute after every render and on xstunitSetRunning, per the
    mockup's ".ghost-btn[disabled]" rule ("disabled when the last run had zero
    failures").

    #runningState (TcXunit-qjt) is a dedicated placeholder shown for the
    duration of a run, in #tree's place -- a separate element from #emptyState
    (not a relabeled/reused one) so it can later become the anchor for
    per-suite progress rows if streaming ever lands, per a companion future
    ticket. window.xstunitBeginRun() (called by
    ResultsToolWindowControl.xaml.cs's StartRunAsync right before the CLI
    process starts) clears #tree's rows/counts and swaps this in; a completed
    run's window.xstunitRenderResult(...) swaps it back out for #tree, and a
    stopped/errored run (no new render) reverts to #emptyState instead of
    leaving this frozen on screen once nothing is actually running -- see
    results.js's xstunitSetRunning. This supersedes TcXunit-1tt.3's original
    "results from a prior run stay visible during a subsequent run" decision,
    per explicit user feedback.
  -->
  <div class="toolbar">
    <button class="send-btn" type="button" id="runButton">Run tests</button>
    <button class="ghost-btn" type="button" id="rerunFailedButton" disabled>Rerun failed</button>
    <div class="counts" id="counts">
      <span class="count zero" id="countPass">✓<span class="n">0</span></span>
      <span class="count zero" id="countFail">✗<span class="n">0</span></span>
      <span class="count zero" id="countSkip">–<span class="n">0</span></span>
    </div>
  </div>

  <div class="prog" id="prog" hidden><i></i></div>

  <div class="tw-body">
    <div class="empty-state" id="emptyState">
      <strong>No results yet.</strong>
      Run the suites in this solution to see pass and fail output here. Double-click any
      result to open its .TcPOU in the editor.
    </div>
    <div class="empty-state running-state" id="runningState" hidden>
      <strong>Running...</strong>
      Test suites are executing. Results will appear here once the run completes.
    </div>
    <div class="tree" id="tree" hidden tabindex="0"></div>
  </div>

  <div class="toolbar tw-footerbar">
    <div class="seg" id="statusSeg">
      <button class="active" data-v="plain" data-status="all" type="button">All</button>
      <button data-v="plain" data-status="fail" type="button">Failed</button>
      <button data-v="plain" data-status="skip" type="button">Skipped</button>
    </div>
    <input class="field" type="text" id="filterInput" placeholder="Filter tests..." autocomplete="off" />
  </div>

  <div class="tw-statusbar">
    <span class="dot"></span>
    <span id="statusText">Ready</span>
  </div>

  <script src="results.js"></script>
</body>
</html>
