<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>xStunit Results</title>
<link rel="stylesheet" href="vsix-tokens.css" />
<link rel="stylesheet" href="vsix-shell.css" />
<link rel="stylesheet" href="results.css" />
</head>
<body>
  <!--
    The WebView2 page ResultsToolWindowControl.xaml.cs hosts. The host follows
    the VS light/dark theme by pushing document.body.dataset.theme in, and
    pushes each run's result JSON in by calling window.xstunitRenderResult;
    results.js holds the whole page-side contract.

    #runButton is the panel's one send-btn/stop-btn, per design-system.html's
    "exactly two [buttons]" rule and user story 12 ("unambiguous about which
    action is live"). Its label and class are host-driven, so it cannot claim a
    run is in flight when none is. #prog, the CSS-only sweep in results.css,
    follows the same state.

    #rerunFailedButton is section 5's ".ghost-btn" affordance. It starts
    disabled because no run has happened yet, and results.js keeps the
    attribute correct from there. The host, not this page, holds the list of
    suites that failed, so the message it posts carries no payload.

    #emptyState is the shared ".empty-state" block from vsix-shell.css, shown
    before the first run. #runningState replaces it for the duration of a run,
    and is a separate element rather than a relabelled one so it can become the
    anchor for per-suite progress rows if the panel ever consumes the CLI's
    event stream. A run that ends without rendering, by Stop or a host-level
    error, reverts to #emptyState rather than leaving the placeholder frozen.

    #tree is .tree's render target. Its tabindex="0" makes it the page's one
    tabbable element: keyboard nav is a roving selection over its .node rows
    tracked in JS, not per-row tabindex or real DOM focus, per section 8's
    A11y rule.

    #statusSeg carries two attributes per segment on purpose: data-v drives
    vsix-shell.css's active-button highlight, data-status is read only by
    results.js, so filtering never depends on visual state. It and #filterInput
    sit in a second .toolbar-styled row below .tw-body rather than in the top
    toolbar; results.js looks both up by id, so the placement is layout-only.

    The .tw-statusbar region is required by section 6's tool-window anatomy and
    is never omitted, empty state included.
  -->
  <div class="toolbar">
    <button class="send-btn" type="button" id="runButton">Run tests</button>
    <button class="ghost-btn" type="button" id="rerunFailedButton" disabled>Rerun failed</button>
    <div class="counts" id="counts">
      <span class="count zero" id="countPass">✓<span class="n">0</span></span>
      <span class="count zero" id="countFail">✗<span class="n">0</span></span>
      <span class="count zero" id="countSkip">–<span class="n">0</span></span>
    </div>
  </div>

  <div class="prog" id="prog" hidden><i></i></div>

  <div class="tw-body">
    <div class="empty-state" id="emptyState">
      <strong>No results yet.</strong>
      Run the suites in this solution to see pass and fail output here. Double-click any
      result to open its .TcPOU in the editor.
    </div>
    <div class="empty-state running-state" id="runningState" hidden>
      <strong>Running...</strong>
      Test suites are executing. Results will appear here once the run completes.
    </div>
    <div class="tree" id="tree" hidden tabindex="0"></div>
  </div>

  <div class="toolbar tw-footerbar">
    <div class="seg" id="statusSeg">
      <button class="active" data-v="plain" data-status="all" type="button">All</button>
      <button data-v="plain" data-status="fail" type="button">Failed</button>
      <button data-v="plain" data-status="skip" type="button">Skipped</button>
    </div>
    <input class="field" type="text" id="filterInput" placeholder="Filter tests..." autocomplete="off" />
  </div>

  <div class="tw-statusbar">
    <span class="dot"></span>
    <span id="statusText">Ready</span>
  </div>

  <script src="results.js"></script>
</body>
</html>
